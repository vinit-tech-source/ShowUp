[build-system]
requires = ["hatchling>=1.21.0"]
build-backend = "hatchling.build"

[project]
name = "showup"
version = "0.1.0"
description = "Local-first no-show reduction tool for solo service businesses"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [{ name = "ShowUp Contributors" }]
keywords = ["appointments", "no-show", "local-first", "machine-learning"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Office/Business :: Scheduling",
]

dependencies = [
    "streamlit==1.66.0",
    "pydantic==2.11.7",
    "pydantic-settings==2.16.0",
    "sqlalchemy==2.0.54",
    "alembic==1.20.0",
    "pandas>=2.2.0,<3.0.0",
    "scikit-learn==1.9.1",
    "structlog==26.1.0",
    "chardet==7.6.0",
    "httpx==0.28.1",
    "tabpfn==2.2.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0,<9.0.0",
    "pytest-cov>=6.0.0,<7.0.0",
    "pytest-asyncio>=0.24.0,<1.0.0",
    "hypothesis>=6.100.0,<7.0.0",
    "mypy>=1.13.0,<2.0.0",
    "ruff>=0.8.0,<1.0.0",
    "pip-audit>=2.7.0,<3.0.0",
    "pre-commit>=4.0.0,<5.0.0",
    "respx>=0.22.0,<1.0.0",
]

[project.scripts]
showup = "showup.ui.app:main"

[project.urls]
Homepage = "https://github.com/vinit-tech-source/ShowUp"
Repository = "https://github.com/vinit-tech-source/ShowUp"
Issues = "https://github.com/vinit-tech-source/ShowUp/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/showup"]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "N",    # pep8-naming
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "SIM",  # flake8-simplify
    "S",    # flake8-bandit (security)
    "A",    # flake8-builtins
    "C4",   # flake8-comprehensions
    "DTZ",  # flake8-datetimez
    "T20",  # flake8-print
    "RET",  # flake8-return
    "PTH",  # flake8-use-pathlib
    "ERA",  # eradicate (commented-out code)
    "PL",   # pylint
    "RUF",  # ruff-specific
]
ignore = [
    "S101",   # allow assert in tests
    "S603",   # allow subprocess without shell=True
    "S607",   # allow partial executable path
    "PLR0913", # allow many function arguments
    "PLR2004", # allow magic values in comparisons
    "N803",   # allow uppercase argument names (e.g. X for feature matrix)
    "N806",   # allow uppercase variable names (e.g. X for feature matrix)
    "RUF001", # allow intentional unicode characters (emojis, em-dashes) in UI strings
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101", "S106", "PLR2004", "PLR0915"]
"src/showup/ui/**/*.py" = ["T20", "E501"]  # allow print and long UI/HTML strings in Streamlit UI
"scripts/**/*.py" = ["T20", "S310", "E501", "PLR0915", "PLR0917", "DTZ005"]  # CLI scripts print to terminal and format reports

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_configs = false
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
show_error_codes = true
mypy_path = "src"

[[tool.mypy.overrides]]
module = [
    "tabpfn.*",
    "streamlit.*",
    "sklearn.*",
    "pandas.*",
    "chardet.*",
    "hypothesis.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "--strict-markers",
    "--tb=short",
    "-ra",
]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "e2e: marks end-to-end tests",
    "integration: marks integration tests",
]
filterwarnings = [
    "error",
    "ignore::DeprecationWarning:streamlit.*",
    "ignore::DeprecationWarning:sklearn.*",
    "ignore::DeprecationWarning:tabpfn.*",
    "ignore::DeprecationWarning:google.*",
    "ignore::DeprecationWarning:alembic.*",
    "ignore::scipy.optimize.OptimizeWarning",
]

[tool.coverage.run]
source = ["showup"]
omit = [
    "src/showup/ui/*",
    "src/showup/synthetic/*",
]

[tool.coverage.report]
fail_under = 85
show_missing = true
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "if __name__ == .__main__.",
    "@overload",
    "raise NotImplementedError",
]
